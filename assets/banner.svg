<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#1a103c"/>
      <stop offset="100%" stop-color="#0b0813"/>
    </linearGradient>

    <!-- Accent Neon Gradients -->
    <linearGradient id="primaryNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Ambient Animated Grid / Wave Particles in Background -->
  <g opacity="0.25">
    <path d="M0,320 Q300,240 600,310 T1200,250" fill="none" stroke="url(#primaryNeon)" stroke-width="4">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M0,320 Q300,240 600,310 T1200,250;
                M0,280 Q300,350 600,270 T1200,310;
                M0,320 Q300,240 600,310 T1200,250"/>
    </path>
    <path d="M0,350 Q300,380 600,300 T1200,360" fill="none" stroke="url(#goldGlow)" stroke-width="3">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0,350 Q300,380 600,300 T1200,360;
                M0,310 Q300,260 600,340 T1200,290;
                M0,350 Q300,380 600,300 T1200,360"/>
    </path>
  </g>

  <!-- Dynamic Sound Equalizer Visualizer (Positioned low/background so text remains 100% visible) -->
  <g transform="translate(100, 290)" opacity="0.45">
    <!-- Equalizer Bars with SVG Animation -->
    <rect x="0" y="0" width="8" height="40" fill="#8a2be2" rx="4">
      <animate attributeName="height" values="20;50;15;40;20" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-20;-50;-15;-40;-20" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="0" width="8" height="60" fill="#c084fc" rx="4">
      <animate attributeName="height" values="40;15;65;30;40" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-40;-15;-65;-30;-40" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="32" y="0" width="8" height="30" fill="#00f2fe" rx="4">
      <animate attributeName="height" values="15;55;25;60;15" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-15;-55;-25;-60;-15" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="0" width="8" height="50" fill="#ff007f" rx="4">
      <animate attributeName="height" values="50;20;70;35;50" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-50;-20;-70;-35;-50" dur="1.4s" repeatCount="indefinite"/>
    </rect>

    <rect x="940" y="0" width="8" height="40" fill="#00f2fe" rx="4">
      <animate attributeName="height" values="30;60;20;45;30" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-30;-60;-20;-45;-30" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="956" y="0" width="8" height="55" fill="#ff007f" rx="4">
      <animate attributeName="height" values="55;25;40;65;55" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-55;-25;-40;-65;-55" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="972" y="0" width="8" height="35" fill="#8a2be2" rx="4">
      <animate attributeName="height" values="20;50;15;60;20" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-20;-50;-15;-60;-20" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Keyboard Graphic Motif (Stylized Synthesizer Keys) -->
  <g transform="translate(420, 280)" filter="url(#subtleGlow)" opacity="0.9">
    <!-- White Keys -->
    <rect x="0" y="0" width="32" height="70" fill="#f8fafc" rx="4"/>
    <rect x="36" y="0" width="32" height="70" fill="#f8fafc" rx="4"/>
    <rect x="72" y="0" width="32" height="70" fill="#f8fafc" rx="4"/>
    <rect x="108" y="0" width="32" height="70" fill="#f8fafc" rx="4"/>
    <rect x="144" y="0" width="32" height="70" fill="#f8fafc" rx="4"/>
    <rect x="180" y="0" width="32" height="70" fill="#f8fafc" rx="4"/>
    <rect x="216" y="0" width="32" height="70" fill="#f8fafc" rx="4"/>
    <rect x="252" y="0" width="32" height="70" fill="#f8fafc" rx="4"/>
    <rect x="288" y="0" width="32" height="70" fill="#f8fafc" rx="4"/>
    <rect x="324" y="0" width="32" height="70" fill="#f8fafc" rx="4"/>

    <!-- Black Keys -->
    <rect x="22" y="0" width="20" height="42" fill="#0f172a" rx="2"/>
    <rect x="58" y="0" width="20" height="42" fill="#0f172a" rx="2"/>
    <rect x="130" y="0" width="20" height="42" fill="#0f172a" rx="2"/>
    <rect x="166" y="0" width="20" height="42" fill="#0f172a" rx="2"/>
    <rect x="202" y="0" width="20" height="42" fill="#0f172a" rx="2"/>
    <rect x="274" y="0" width="20" height="42" fill="#0f172a" rx="2"/>
    <rect x="310" y="0" width="20" height="42" fill="#0f172a" rx="2"/>

    <!-- Animated Keypress Light Glow -->
    <rect x="144" y="0" width="32" height="70" fill="url(#primaryNeon)" rx="4" opacity="0.8">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="252" y="0" width="32" height="70" fill="url(#goldGlow)" rx="4" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- FOREGROUND TEXT (Clear, Bold, Unobstructed Title & Subtitle) -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <rect x="420" y="55" width="360" height="32" rx="16" fill="rgba(138, 43, 226, 0.25)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="600" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e9d5ff" letter-spacing="2">
      🎹 GENERATIVE AI MUSIC &amp; HARDWARE 🎶
    </text>

    <!-- Main Title -->
    <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryNeon)" filter="url(#glow)" letter-spacing="-0.5">
      Awesome Generative AI Music Keyboard
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#f1f5f9" letter-spacing="0.5">
      Curated Directory of Commercial AI Music SaaS, Open-Source Models &amp; Smart MIDI Keyboards
    </text>

    <!-- Tagline Chips -->
    <text x="600" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="1">
      Suno • Udio • ACE-Step 1.5 • Google Magenta RealTime 2 • ROLI • AWS DeepComposer
    </text>
  </g>
</svg>
